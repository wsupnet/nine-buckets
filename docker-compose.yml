name: networth

# Nine Buckets — net worth & allocation tracker
#
# The only compose file — deploy with:  git pull && docker compose up -d --build
# On a NAS, point the Docker app's Project at this folder.
#
# No .env is needed to start it. Without one:
#   - the sign-in passphrase is generated on first start and printed in the log
#     (docker compose logs); it is kept in data/.app_password
#   - your data goes in ./data next to this file
# To choose your own passphrase or data folder, copy .env.example to .env.
# On Linux/NAS, `user:` below must match the owner of the data folder.

services:
  networth:
    build: .
    image: networth-tracker:latest
    container_name: networth
    restart: unless-stopped

    # The container writes to /data. A bind-mounted NAS folder keeps its own
    # ownership, so the process must run as a uid that can write to it.
    # NAS shared folders are usually owned by your admin user (often 1000:1000).
    # Check with:  ls -ln /volume1/docker/appdata/networth/data
    # then set this to that <uid>:<gid>. Avoid "0:0" (root) unless you have to.
    user: "1000:1000"

    environment:
      # ---- Secrets, read from .env (both optional) -----------------------
      # Empty = a passphrase is generated once and kept in /data/.app_password.
      APP_PASSWORD: ${APP_PASSWORD:-}
      # Optional. Empty = a random key is generated and kept in /data/.session_secret.
      SECRET_KEY: ${SECRET_KEY:-}

      # ---- Access --------------------------------------------------------
      AUTH_ENABLED: "1"
      SESSION_DAYS: "30"
      # Set to 1 only if you put HTTPS in front of this.
      SESSION_HTTPS_ONLY: "0"

      # ---- Data ----------------------------------------------------------
      DB_PATH: /data/networth.db
      # Shown in the startup log so you can see which host folder is in use.
      NETWORTH_DATA: ${NETWORTH_DATA:-./data}
      # TEMPORARY: lets the app spot a .env still on the old APPDATA layout and
      # say how to move. Remove once every install uses NETWORTH_DATA.
      LEGACY_APPDATA: ${APPDATA:-}
      # Set TZ in .env (e.g. TZ=Europe/Berlin); UTC if unset.
      TZ: ${TZ:-UTC}
      # Keep 0. Set to 1 only if you want the sample portfolio to explore.
      SEED_DEMO: "0"

      # ---- Prices & FX ---------------------------------------------------
      REFRESH_ENABLED: "1"
      REFRESH_ON_START: "1"
      REFRESH_INTERVAL_HOURS: "24"

      # ---- Backups -------------------------------------------------------
      BACKUP_ENABLED: "1"
      BACKUP_INTERVAL_HOURS: "24"
      BACKUP_RETENTION_DAYS: "30"
      # Backups are written to the backups/ folder inside the data folder.

      LOG_LEVEL: INFO

    ports:
      # Reachable from anything on your LAN at http://<nas-ip>:8000
      # The passphrase is what protects it. To restrict it to the NAS itself
      # (VPN/Tailscale only), change to "127.0.0.1:8000:8000".
      - "8000:8000"

    volumes:
      # Everything the app keeps (database, session secret, backups/) lives in
      # this ONE host folder: ./data next to this file, or NETWORTH_DATA from .env.
      # Not APPDATA: Windows already defines that name for every user.
      #
      # On a NAS, set NETWORTH_DATA to a folder OUTSIDE this project folder, so a
      # Docker app that replaces the project folder on update can't delete it.
      # On Linux/NAS the folder must be owned by the `user:` above; if Docker has
      # to create it, it's owned by root and the app says how to fix it.
      - ${NETWORTH_DATA:-./data}:/data

    # Healthcheck is defined once, in the Dockerfile.

    mem_limit: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true
